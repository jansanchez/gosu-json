name: Draft release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check tag version
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME !== "v" + p.version) process.exit(1)'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npm run package
      - name: Create draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --title "GOSU JSON $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md releases/*.zip releases/SHA256SUMS.txt
