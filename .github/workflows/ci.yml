name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: gosu-json-builds
          path: |
            releases/*.zip
            releases/SHA256SUMS.txt
